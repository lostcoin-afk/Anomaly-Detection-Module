[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harting-anomaly"
version = "0.1.0"
description = "Scalable industrial visual anomaly detection system using PatchCore and Anomalib."
requires-python = ">=3.10,<3.13"

dependencies = [
    "anomalib==2.6.2",
    "numpy>=2.0,<3.0",
    "opencv-python>=4.10,<5.0",
    "pillow>=10.0,<12.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "pandas>=2.2,<3.0",
    "psutil>=6.0,<8.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
]

gpu = [
    "nvidia-ml-py>=12.0,<14.0",
]

[project.scripts]
harting-scan = "harting_anomaly.data.catalog:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]